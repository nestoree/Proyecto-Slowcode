<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tama Invaders - Boss Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ui">
        <div>Puntos: <span id="score">0</span> | Ronda: <span id="round">1</span></div>
        <div class="health-bar-container">
            <div id="player-health-bar" class="health-fill"></div>
        </div>
        <div id="boss-ui" class="hidden">
            <small>JEFE FINAL</small>
            <div class="health-bar-container boss">
                <div id="boss-health-bar" class="health-fill"></div>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="game-over" class="hidden">
        <h1 id="result-title">¡NAVE DESTRUIDA!</h1>
        <p>Puntos totales: <span id="final-points">0</span></p>
        <button onclick="location.reload()">REINTENTAR</button>
        <a href="../index.html" class="exit-btn">VOLVER A CASA</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
